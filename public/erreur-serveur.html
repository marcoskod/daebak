<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service momentanément indisponible — Be.Bright</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#faf9f7;color:#1a1c1b;font-family:'Roboto',sans-serif}
        header{padding:24px 20px}
        header img{height:44px;width:auto;display:block}
        main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px;text-align:center}
        .box{max-width:520px}
        .badge{width:76px;height:76px;margin:0 auto 24px;border-radius:50%;background:rgba(254,215,202,.55);display:flex;align-items:center;justify-content:center;font-size:34px}
        .code{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#75584d;font-weight:500}
        h1{font-family:'Poppins',sans-serif;font-weight:600;font-size:clamp(26px,5vw,38px);line-height:1.2;color:#442a22;margin:8px 0 12px}
        p{color:#504441;line-height:1.6;margin:0}
        .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:32px}
        a.btn{display:inline-block;padding:12px 26px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;background:#f4f3f1;color:#442a22}
        a.btn.primary{background:#442a22;color:#fff}
        footer{padding:24px 20px;text-align:center;font-size:12px;color:#827470}
        footer a{color:#442a22}
    </style>
</head>
<body>
    <header><a href="/"><img src="/images/logo.webp" alt="Be.Bright — Éclat &amp; Beauté"></a></header>
    <main>
        <div class="box">
            <div class="badge">🛠️</div>
            <div class="code">Service momentanément indisponible</div>
            <h1>Nous revenons très vite</h1>
            <p>Un souci technique empêche d'afficher cette page. Notre équipe s'en occupe. Merci de réessayer dans quelques minutes.</p>
            <div class="actions">
                <a class="btn primary" href="/">Retour à l'accueil</a>
                <a class="btn" href="/diagnostic">Faire mon diagnostic</a>
                <a class="btn" href="/catalogue">Voir le catalogue</a>
            </div>
        </div>
    </main>
    <footer>Besoin d'aide ? <a href="https://wa.me/2290190119174" target="_blank" rel="noopener">Écrivez-nous sur WhatsApp</a></footer>
</body>
</html>
